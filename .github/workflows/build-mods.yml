name: Build mods

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.mod }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod:
          - assistance-drone
          - farmer-drone
          - path_lighter_drone
          - pickup-dumper

    defaults:
      run:
        working-directory: ${{ matrix.mod }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon build
