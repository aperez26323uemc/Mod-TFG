name: Build mods

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect-changes:
    name: Detect changed mods
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.detect.outputs.mods }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: detect
        run: |
          set -euo pipefail

          all_mods=(
            assistance_drone
            farmer_drone
            path_lighter_drone
            pickup_dumper
            pov_drone
          )

          event_name="${{ github.event_name }}"
          ref="${{ github.ref }}"

          # Full build for manual runs and tags.
          if [[ "$event_name" == "workflow_dispatch" || "$ref" == refs/tags/* ]]; then
            selected_mods=("${all_mods[@]}")
          else
            if [[ "$event_name" == "pull_request" ]]; then
              base_sha="${{ github.event.pull_request.base.sha }}"
              head_sha="${{ github.event.pull_request.head.sha }}"
            else
              base_sha="${{ github.event.before }}"
              head_sha="${{ github.sha }}"
            fi

            if [[ "$base_sha" =~ ^0+$ ]]; then
              selected_mods=("${all_mods[@]}")
            else
              changed_files=$(git diff --name-only "$base_sha" "$head_sha")
              selected_mods=()

              for mod in "${all_mods[@]}"; do
                if grep -qE "^${mod}/" <<<"$changed_files"; then
                  selected_mods+=("$mod")
                fi
              done

              # If CI config changes, rebuild everything.
              if grep -qE '^\.github/workflows/' <<<"$changed_files"; then
                selected_mods=("${all_mods[@]}")
              fi
            fi
          fi

          if [[ ${#selected_mods[@]} -eq 0 ]]; then
            echo 'mods=[]' >> "$GITHUB_OUTPUT"
            echo 'has_changes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mods_json=$(printf '%s\n' "${selected_mods[@]}" | jq -R . | jq -cs .)
          echo "mods=$mods_json" >> "$GITHUB_OUTPUT"
          echo 'has_changes=true' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.mod }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.detect-changes.outputs.mods) }}

    defaults:
      run:
        working-directory: ${{ matrix.mod }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew --no-daemon build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: ${{ matrix.mod }}/build/libs/*.jar

  release-from-tag:
    name: Create release from global tag
    needs:
      - detect-changes
      - build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.jar
